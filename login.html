<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — DockClock</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230B1220%22/><circle cx=%2250%22 cy=%2250%22 r=%2230%22 fill=%22none%22 stroke=%22%23E8590C%22 stroke-width=%228%22/><path d=%22M50 32v20l14 10%22 fill=%22none%22 stroke=%22%23E8590C%22 stroke-width=%228%22 stroke-linecap=%22round%22/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div style="display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:var(--paper);">
    <div class="fade-up" style="width:100%;max-width:380px;">
      <div style="display:flex;justify-content:center;margin-bottom:32px;">
        <span style="display:inline-flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:18px;">
          <span style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:var(--ink-950);">
            <svg width="16" height="16" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="34" stroke="#E8590C" stroke-width="10"/><path d="M50 30v20l14 10" stroke="#E8590C" stroke-width="10" stroke-linecap="round"/></svg>
          </span>
          DockClock
        </span>
      </div>

      <div class="card card-pad">
        <h1 style="font-size:20px;">Welcome back</h1>
        <p style="margin-top:4px;font-size:14px;color:var(--ink-500);">Log in to your DockClock dashboard.</p>

        <form id="login-form" style="margin-top:24px;">
          <div class="field">
            <label class="label" for="email">Email</label>
            <input class="input" type="email" id="email" required />
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <input class="input" type="password" id="password" required />
          </div>

          <div id="login-error" style="margin-top:16px;"></div>

          <button type="submit" id="login-submit" class="btn btn-accent btn-block" style="margin-top:16px;">Log in</button>
        </form>
      </div>

      <p style="margin-top:24px;text-align:center;font-size:14px;color:var(--ink-500);">
        Don't have an account? <a href="signup.html" style="font-weight:700;color:var(--ink-950);">Sign up free</a>
      </p>
    </div>
  </div>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
